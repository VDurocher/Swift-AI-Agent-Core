excluded:
  - Examples/ChatApp  # Example app, not library code
  - Package.swift

disabled_rules:
  - redundant_sendable     # actors are already Sendable in Swift 6
  - orphaned_doc_comment   # module-level doc comments

opt_in_rules:
  - empty_count
  - force_unwrapping

nesting:
  type_level:
    warning: 3
    error: 4

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

trailing_comma:
  mandatory_comma: false
